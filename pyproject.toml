[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[project]
name = "govdomains"
version = "0.1.0"
description = "Infer government affiliation from domain patterns and source evidence; collect reproducible hostname samples."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Gaurav Sood"}]
keywords = ["government", "domains", "common-crawl", "classification", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["idna>=3.7", "requests>=2.32", "urllib3>=2.2"]

[project.optional-dependencies]
data = ["pyarrow>=21"]
collect = ["beautifulsoup4>=4.13"]

[project.urls]
Homepage = "https://github.com/themains/govdomains"
Documentation = "https://themains.github.io/govdomains/"
Repository = "https://github.com/themains/govdomains"
Issues = "https://github.com/themains/govdomains/issues"

[project.scripts]
govdomains = "govdomains.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
minversion = "6"
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"

[tool.uv.build-backend]
module-name = "govdomains"
source-include = ["tests/**", "scripts/**", "docs/**", "data/README.md", "CHANGELOG.md", "Makefile", "uv.lock"]
source-exclude = ["docs/_build/**", "docs/api/**", "*.bak"]

[dependency-groups]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]
test = ["pytest>=8", "pytest-cov>=6", "pyarrow>=21", "beautifulsoup4>=4.13"]
dev = [{include-group = "test"}, "ruff>=0.14", "pyright>=1.1.390", "pre-commit>=4"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 90

[tool.preen]
link_ignore = [
    # Normalization and rejection fixtures are not live destinations.
    '^https?://(user:secret@)?agency\.gov(?:/.*|\./.*)?$',
    '^https?://xn--zfr164b\.cn/',
    '^https?://a\.gov/other,',
    # This literal is a prefix; the builder appends a pinned revision and path.
    '^https://raw\.githubusercontent\.com/themains/gov_privacy/$',
    # The policy was read when selecting bundles; its TLS chain fails on CI.
    '^https://igod\.gov\.in/website_policies$',
]
