# Patterns are written without a scheme: preen's links check scans this file
# too, and a pattern with one would be extracted and checked as a link.
exclude = [
  # Normalization and rejection fixtures are not live destinations.
  '//(user:secret@)?agency\.gov(?:/.*|\./.*)?$',
  '//xn--zfr164b\.cn/',
  '//a\.gov/other,',
  # This literal is a prefix; the builder appends a pinned revision and path.
  '//raw\.githubusercontent\.com/themains/gov_privacy/$',
  # The policy was read when selecting bundles; its TLS chain fails on CI.
  '//igod\.gov\.in/website_policies$',
]
